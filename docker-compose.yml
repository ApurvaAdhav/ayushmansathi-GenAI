
services:
  api:
    build: .
    container_name: ayushmansathi-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  ui:
    build: .
    container_name: ayushmansathi-ui
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_URL: http://api:8001
    depends_on:
      - api
    volumes:
      - ./ui/feedback.json:/app/ui/feedback.json
    restart: unless-stopped
