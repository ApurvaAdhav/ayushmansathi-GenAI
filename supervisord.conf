[supervisord]
nodaemon=true

[program:fastapi]
command=uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/app
autostart=true
autorestart=true
priority=10

[program:streamlit]
command=streamlit run ui/app.py --server.port 8501 --server.address 127.0.0.1 --server.headless true --browser.gatherUsageStats false
directory=/app
autostart=true
autorestart=true
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
